</div>
<!-- Email -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase tracking-wider" for="email">Correo Electrónico</label>
<input class="w-full bg-[#f5f5f5] border-t-0 border-x-0 border-b-2 border-outline-variant py-3 px-4 transition-colors focus:ring-0 focus:border-primary" id="email" placeholder="elena@herencia.com" type="email">
</div>
<!-- Password -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase tracking-wider" for="password">Contraseña</label>
<input class="w-full bg-[#f5f5f5] border-t-0 border-x-0 border-b-2 border-outline-variant py-3 px-4 transition-colors focus:ring-0 focus:border-primary" id="password" placeholder="••••••••" type="password">
</div>
<!-- Confirm Password -->
<div class="relative group">
<label class="block font-label-md text-label-md text-on-surface-variant mb-1 uppercase tracking-wider" for="confirmPassword">Confirmar Contraseña</label>
<input class="w-full bg-[#f5f5f5] border-t-0 border-x-0 border-b-2 border-outline-variant py-3 px-4 transition-colors focus:ring-0 focus:border-primary" id="confirmPassword" placeholder="••••••••" type="password">
</div>
<!-- Create Account Button -->
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-headline-sm text-headline-sm transition-transform active:scale-[0.98] hover:opacity-90 shadow-md" type="submit">
                    Crear Cuenta

<!-- Script for subtle form micro-interactions -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });
